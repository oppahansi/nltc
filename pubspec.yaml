name: ltc
description: "Legacy Talent Calculator"

publish_to: 'none'

version: 1.1.0+8

environment:
  sdk: ^3.13.0

dependencies:
  cupertino_icons: ^2.0.0
  exui: ^1.0.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.2
  material_symbols_icons: ^4.2858.1
  path: ^1.9.1
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  sqflite: ^2.4.2
dev_dependencies:
  build_runner:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  sqflite_common_ffi: ^2.4.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/db/
    - assets/images/icons/
    - assets/images/bgs/
    - lib/l10n/
  fonts:
    - family: LifeCraft
      fonts:
        - asset: assets/fonts/LifeCraft.ttf

flutter_intl:
  enabled: true
  arb_dir: l10n
  output_dir: lib/l10n
  class_name: AppLocalizations
  synthetic_package: true

better_imports:
  ignore_files:
    - app_localizations
    - app_localizations_de
    - app_localizations_en
